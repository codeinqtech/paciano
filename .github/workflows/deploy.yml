name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (skipped if no lint script)
        run: npm run lint --if-present

      - name: Test (skipped if no test script)
        run: npm test --if-present

      - name: Build
        env:
            FIGMA_PUBLIC_URL: ${{ vars.FIGMA_PUBLIC_URL }}
        run: npm run build

      - name: Deploy to staging via FTP
        if: github.event_name == 'push'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          local-dir: ./dist/
          server-dir: /domains/codeinq.com/public_html/paciano/design/tmp_1/